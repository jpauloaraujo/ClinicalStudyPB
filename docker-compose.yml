# T67: ambiente completo, sem mocks: PostgreSQL + backend (Spring Boot) + web (React servido por nginx).
#
#   docker compose up --build -d     # sobe tudo (primeira vez demora: baixa Maven e npm)
#   docker compose ps                # os três devem ficar "healthy"
#   docker compose logs -f backend   # acompanha o backend
#   docker compose down              # para (os dados ficam no volume)
#   docker compose down -v           # para e apaga o banco
#
# Web: http://localhost:5173 · API: http://localhost:8081 · Swagger: http://localhost:8081/swagger-ui.html
# Valores padrão abaixo são fictícios; para trocar, copie .env.example para .env (ignorado pelo Git).
# O app mobile (Expo) roda fora do Docker, apontando para http://<IP-da-máquina>:8081.

name: clinicalstudypb

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicalstudypb
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # Porta 5433 no host para não conflitar com um PostgreSQL local instalado na 5432
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d clinicalstudypb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend/ClinicalStudyPB
    environment:
      DB_URL: jdbc:postgresql://db:5432/clinicalstudypb
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-segredo-ficticio-do-docker-compose-com-mais-de-256-bits-0123456789}
      # demo = migrations comuns + dados fictícios de demonstração (T63). Use "prod" para só as migrations.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_JPA_SHOW_SQL: "false"
      # Origens que o navegador pode usar para chamar a API (web e Expo web)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8082}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web/ClinicalStudyPB
      args:
        # Endereço da API visto pelo navegador (não pelo container)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dados-postgres:
