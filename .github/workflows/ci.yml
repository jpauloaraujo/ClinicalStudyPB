# T05 (PBI-01): build e verificações básicas a cada push e pull request na main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ClinicalStudyPB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testes usam H2 em memória e segredo JWT fictício (src/test/resources), sem PostgreSQL
      - name: Testes
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-backend
          path: backend/ClinicalStudyPB/target/surefire-reports/
          if-no-files-found: ignore

  web:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ClinicalStudyPB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/ClinicalStudyPB/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (inclui verificação de tipos)
        run: npm run build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/ClinicalStudyPB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/ClinicalStudyPB/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Verificação de tipos
        run: npm run typecheck
