# T05 (PBI-01): build e verificações básicas a cada push e pull request na main e na develop
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ClinicalStudyPB
    env:
      # T64: até 04/11 a cobertura só é informada. Em 05/11 trocar para 'true' (uma linha só):
      # o pipeline passa a falhar se o código de negócio (domínio e serviços) ficar abaixo de 80% das linhas
      COBERTURA_BLOQUEAR: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testes usam H2 em memória e segredo JWT fictício (src/test/resources), sem PostgreSQL
      - name: Testes
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Djacoco.haltOnFailure=${{ env.COBERTURA_BLOQUEAR }}
      - name: Resumo da cobertura
        if: always() && hashFiles('backend/ClinicalStudyPB/target/site/jacoco/jacoco.csv') != ''
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/resumo-cobertura.py" target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: backend/ClinicalStudyPB/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore
      - name: Relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-backend
          path: backend/ClinicalStudyPB/target/surefire-reports/
          if-no-files-found: ignore

  # Mesmos testes do backend, mas contra PostgreSQL real (as variáveis de ambiente
  # sobrescrevem a URL H2 de src/test/resources): valida migrations e consultas no banco de produção
  backend-postgres:
    name: Backend (testes no PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ClinicalStudyPB
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clinicalstudypb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/clinicalstudypb_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes no PostgreSQL
        run: |
          chmod +x mvnw
          ./mvnw -B test

  web:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ClinicalStudyPB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/ClinicalStudyPB/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes de componente (Vitest)
        run: npm test
      - name: Build (inclui verificação de tipos)
        run: npm run build

  # T65: testes E2E do web com Playwright contra backend e PostgreSQL reais
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clinicalstudypb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/ClinicalStudyPB/package-lock.json

      - name: Empacota e sobe o backend
        working-directory: backend/ClinicalStudyPB
        env:
          DB_URL: jdbc:postgresql://localhost:5432/clinicalstudypb
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: segredo-ficticio-do-e2e-com-mais-de-256-bits-0123456789
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
          nohup java -jar "$(ls target/*.jar | grep -v original | head -1)" > "$GITHUB_WORKSPACE/backend.log" 2>&1 &

      - name: Instala, constrói e serve o web
        working-directory: web/ClinicalStudyPB
        env:
          VITE_API_URL: http://localhost:8081
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 --strictPort > "$GITHUB_WORKSPACE/web.log" 2>&1 &

      - name: Espera backend e web ficarem prontos
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/v3/api-docs > /dev/null && break
            [ "$i" = 60 ] && { echo "Backend não respondeu"; cat backend.log; exit 1; }
            sleep 2
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/login > /dev/null && break
            [ "$i" = 30 ] && { echo "Web não respondeu"; cat web.log; exit 1; }
            sleep 2
          done

      - name: Instala o Chromium
        working-directory: web/ClinicalStudyPB
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        working-directory: web/ClinicalStudyPB
        # O exemplo traz só valores fictícios de teste; usá-lo aqui o mantém sempre válido
        run: |
          cp .env.e2e.example .env.e2e
          npm run test:e2e

      - name: Relatório e traces do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/ClinicalStudyPB/playwright-report/
            web/ClinicalStudyPB/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Logs do backend e do web
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-e2e
          path: |
            backend.log
            web.log
          retention-days: 14
          if-no-files-found: ignore

  # T67: sobe o ambiente completo do docker-compose.yml (PostgreSQL + backend + web/nginx, sem mocks)
  # e percorre o fluxo de planejamento e a regressão de RF01 a RF04 pela API
  docker:
    name: Ambiente Docker (T67)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Constrói e sobe o ambiente
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Verifica o fluxo de planejamento
        run: python3 scripts/verificar-ambiente.py
      - name: Verifica o fluxo de recrutamento (T68)
        run: python3 scripts/verificar-recrutamento.py
      - name: Logs dos containers
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color > docker-compose.log
      - name: Publica os logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-docker-compose
          path: docker-compose.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/ClinicalStudyPB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/ClinicalStudyPB/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Verificação de tipos
        run: npm run typecheck
