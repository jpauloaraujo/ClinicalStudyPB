        unidade:
          type: string
          nullable: true
          example: mmHg
        observacao:
          type: string
          nullable: true
          example: Sentado, após 5 minutos
        registradoPor:
          type: string
          example: Pesquisador Demo (Ficticio)
        registradoEm:
          type: string
          format: date-time
          example: '2026-11-14T10:00:00-03:00'
        alteradoPor:
          type: string
          example: Pesquisador Demo (Ficticio)
        alteradoEm:
          type: string
          format: date-time
          example: '2026-11-14T10:00:00-03:00'
      required:
      - acaoId
      - valor
      - registradoPor
      - registradoEm
      - alteradoPor
      - alteradoEm
    ResultadoRequest:
