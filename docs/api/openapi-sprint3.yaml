# Contrato OpenAPI da Sprint 3 (RF12 a RF18). Mantido pela equipe: edite-o diretamente quando houver divergência
# com o código, no mesmo Pull Request. Este arquivo cresce a cada PBI e cada PBI acrescenta só os seus caminhos, para
# evitar conflito de merge: a T74 trouxe o agendamento (PBI-19), a T95 o histórico do participante e a T88 os
# resultados das avaliações (PBI-21); o desfecho, a retirada e o app entram nos PBIs seguintes.
openapi: 3.0.3
info:
  title: ClinicalStudyPB — contrato da Sprint 3 (RF12 a RF18)
  version: 1.0.0
  description: |-
    Contrato dos endpoints de acompanhamento da Sprint 3, escrito para web, mobile e backend andarem em paralelo
    (os tipos TypeScript são gerados deste arquivo com `npm run api:tipos`).

    **Datas e horas:** a API **devolve** `OffsetDateTime` ISO 8601 com o fuso do centro (`app.fuso-horario`, padrão
    `America/Fortaleza`, ex.: `2026-11-19T09:30:00-03:00`) e **recebe** data e hora locais sem fuso. Datas puras
    são `yyyy-MM-dd`.

    **Erros:** formato único `{"erro", "codigo?"}` (ver o schema `Erro`): 400 validação, 401 sem token, 403 perfil
    sem permissão, 404 recurso inexistente, 409 regra de negócio violada, sempre com `codigo`.

    **Perfis:** a escrita do agendamento é só do COORDENADOR e a dos resultados das avaliações é só do PESQUISADOR; a
    leitura (visitas, agenda, resultados e histórico) é de COORDENADOR e PESQUISADOR.

    **Teste de contrato:** `ContratoOpenApiSprint3Test` confere que o YAML e os DTOs do backend têm os mesmos campos.
servers:
- url: http://localhost:8081
  description: Backend local
security:
- bearerAuth: []
tags:
- name: Agendamento
- name: Agenda
- name: Histórico do participante
- name: Resultados das avaliações
paths:
  /api/participacoes/{participacaoId}/visitas:
    get:
      tags:
      - Agendamento
      summary: Visitas previstas do participante e seus agendamentos
      operationId: visitasDoParticipante
      description: |-
        Um item para **cada visita prevista do estudo**, ordenado por `ordem`, com a data sugerida (data de inclusão
        mais o dia previsto), a janela válida (`janelaInicio` a `janelaFim`, a data sugerida mais ou menos a tolerância)
        e o `agendamento` da visita, que é nulo enquanto ela não foi agendada.

        Perfis: COORDENADOR e PESQUISADOR leem; ADMINISTRADOR e PARTICIPANTE recebem 403.
      parameters:
      - $ref: '#/components/parameters/ParticipacaoId'
      responses:
        '200':
          description: Visitas previstas do estudo com o agendamento de cada uma.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitaDoParticipanteResponse'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
  /api/participacoes/{participacaoId}/visitas-agendadas:
    post:
      tags:
      - Agendamento
      summary: Agendar uma visita do participante
      operationId: agendarVisita
      description: |-
        Agenda uma visita prevista para o participante. A `dataHora` é **local, sem fuso** (`2026-11-19T09:30`); na
        resposta ela volta com o deslocamento do fuso do centro (`2026-11-19T09:30:00-03:00`).

        Regras: o estudo precisa estar em RECRUTAMENTO ou EXECUCAO; a data é de hoje em diante e fica dentro da janela
        da visita prevista (inclusão mais dia previsto, mais ou menos a tolerância); só pode haver uma visita agendada
        por visita prevista e por participante, e uma visita cancelada não é agendada de novo.

        Códigos 409: ESTUDO_FORA_DE_RECRUTAMENTO_OU_EXECUCAO, VISITA_JA_AGENDADA, DATA_FORA_DA_JANELA (a mensagem traz
        a janela válida), DATA_NO_PASSADO.

        Perfis: somente COORDENADOR; os demais recebem 403.
      parameters:
      - $ref: '#/components/parameters/ParticipacaoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitaAgendadaRequest'
      responses:
        '201':
          description: Visita agendada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitaAgendadaResponse'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
  /api/visitas-agendadas/{visitaAgendadaId}:
    put:
      tags:
      - Agendamento
      summary: Reagendar uma visita
      operationId: reagendarVisita
      description: |-
        Troca a data e a hora de uma visita que ainda está AGENDADA. A nova `dataHora` é local, sem fuso, e passa pelas
        mesmas regras de janela e de data do agendamento.

        Códigos 409: VISITA_NAO_ESTA_AGENDADA (só AGENDADA pode ser reagendada), ESTUDO_FORA_DE_RECRUTAMENTO_OU_EXECUCAO,
        DATA_FORA_DA_JANELA, DATA_NO_PASSADO.

        Perfis: somente COORDENADOR; os demais recebem 403.
      parameters:
      - name: visitaAgendadaId
        in: path
        required: true
        description: UUID da visita agendada.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitaReagendamentoRequest'
      responses:
        '200':
          description: Visita reagendada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitaAgendadaResponse'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
  /api/estudos/{estudoId}/agenda:
    get:
      tags:
      - Agenda
      summary: Agenda do estudo por período e situação
      operationId: agendaDoEstudo
      description: |-
        Visitas agendadas de todos os participantes do estudo, paginadas e ordenadas por data e hora. Os filtros
        `de` e `ate` (datas, inclusivas) e `situacao` são opcionais.

        Perfis: COORDENADOR e PESQUISADOR leem; ADMINISTRADOR e PARTICIPANTE recebem 403.
      parameters:
      - name: estudoId
        in: path
        required: true
        description: UUID do estudo.
        schema:
          type: string
          format: uuid
      - name: de
        in: query
        required: false
        description: Data inicial do período, inclusive (`yyyy-MM-dd`).
        schema:
          type: string
          format: date
      - name: ate
        in: query
        required: false
        description: Data final do período, inclusive (`yyyy-MM-dd`). Não pode ser anterior a `de`.
        schema:
          type: string
          format: date
      - name: situacao
        in: query
        required: false
        description: Filtra por situação da visita agendada.
        schema:
          $ref: '#/components/schemas/SituacaoVisita'
      - name: pagina
        in: query
        required: false
        description: Página, base 0.
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: tamanho
        in: query
        required: false
        description: Itens por página (máximo 100).
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Página da agenda do estudo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAgenda'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
  /api/estudos/{estudoId}/agenda/participantes:
    get:
      tags:
      - Agenda
      summary: Participantes do estudo com a contagem de visitas agendadas
      operationId: participantesDaAgenda
      description: |-
        Os participantes do estudo com quantas visitas previstas o estudo tem e quantas já foram agendadas ("2 de 3
        visitas agendadas"). Conta como agendada a visita que tem agendamento em qualquer situação.

        Perfis: COORDENADOR e PESQUISADOR leem; ADMINISTRADOR e PARTICIPANTE recebem 403.
      parameters:
      - name: estudoId
        in: path
        required: true
        description: UUID do estudo.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Participantes do estudo com o andamento do agendamento.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParticipanteAgendaResponse'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
  /api/participacoes/{participacaoId}/historico:
    get:
      tags:
      - Histórico do participante
      summary: Histórico de um participante
      operationId: historicoDoParticipante
      description: |-
        Somente leitura. Devolve os dados do participante, o resumo por situação e **uma linha para cada visita
        prevista do estudo**, ordenadas por `ordem` e dia previsto, inclusive as ainda não agendadas
        (`situacao = NAO_AGENDADA`, com os campos do agendamento nulos). Cada visita traz a situação, as datas e a
        lista de resultados das atividades.

        `pendentes = agendadas + naoAgendadas`: visitas previstas sem agendamento mais as ainda agendadas, sem desfecho.
        O desenho do histórico de um participante retirado (situação e dados da retirada) entra com a retirada de participante.

        Perfis: PESQUISADOR e COORDENADOR leem; ADMINISTRADOR e PARTICIPANTE recebem 403.
      parameters:
      - name: participacaoId
        in: path
        required: true
        description: UUID da participação (o participante incluído no estudo).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Histórico completo do participante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricoParticipanteResponse'
              example:
                participante:
                  participacaoId: d6300000-0000-4000-8000-000000001921
                  candidatoId: d6300000-0000-4000-8000-000000001911
                  codigo: CAND-001
                  nomeFicticio: Pessoa Teta (Ficticia)
                  dataInclusao: '2026-10-20'
                resumo:
                  previstas: 3
                  realizadas: 1
                  ausentes: 0
                  canceladas: 0
                  agendadas: 1
                  naoAgendadas: 1
                  pendentes: 2
                visitas:
                - visitaPlanejadaId: d6300000-0000-4000-8000-000000001931
                  nome: Triagem
                  ordem: 1
                  diaPrevisto: 0
                  tolerancia: 3
                  dataSugerida: '2026-10-20'
                  situacao: REALIZADA
                  visitaAgendadaId: d6300000-0000-4000-8000-000000001981
                  dataHoraAgendada: '2026-10-20T09:00:00-03:00'
                  dataHoraRealizada: '2026-10-20T09:10:00-03:00'
                  motivo: null
                  observacao: null
                  resultados:
                  - acaoId: d6300000-0000-4000-8000-000000001941
                    nome: Aferir pressão arterial
                    valor: 120/80
                    unidade: mmHg
                    observacao: null
                - visitaPlanejadaId: d6300000-0000-4000-8000-000000001932
                  nome: Retorno 30 dias
                  ordem: 2
                  diaPrevisto: 30
                  tolerancia: 5
                  dataSugerida: '2026-11-19'
                  situacao: AGENDADA
                  visitaAgendadaId: d6300000-0000-4000-8000-000000001982
                  dataHoraAgendada: '2026-11-19T09:30:00-03:00'
                  dataHoraRealizada: null
                  motivo: null
                  observacao: null
                  resultados: []
                - visitaPlanejadaId: d6300000-0000-4000-8000-000000001933
                  nome: Retorno 60 dias
                  ordem: 3
                  diaPrevisto: 60
                  tolerancia: 7
                  dataSugerida: '2026-12-19'
                  situacao: NAO_AGENDADA
                  visitaAgendadaId: null
                  dataHoraAgendada: null
                  dataHoraRealizada: null
                  motivo: null
                  observacao: null
                  resultados: []
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
  /api/visitas-agendadas/{visitaAgendadaId}/resultados:
    get:
      tags:
      - Resultados das avaliações
      summary: Resultados das avaliações de uma visita
      operationId: resultadosDaVisita
      description: |-
        Lista **cada atividade da categoria `AVALIACAO_CLINICA`** da visita prevista desta visita agendada, ordenada
        pelo nome, com o resultado registrado ou `resultado: null` (pendente), e as contagens `total`, `registrados` e
        `pendentes` (`pendentes = total - registrados`). Atividades de outras categorias não aparecem. **Os resultados
        são fictícios**: o sistema não armazena dados reais de pessoas.

        Responde 200 em qualquer situação da visita. Quando a visita **não aceita** registro nem edição de resultados,
        o campo `bloqueio` diz por quê, e a tela mostra os resultados **somente leitura**:
        - `VISITA_NAO_REALIZADA`: a visita está AGENDADA, AUSENTE ou CANCELADA (resultado só existe para REALIZADA);
        - `ESTUDO_ENCERRADO`: o estudo foi encerrado;
        - `PARTICIPANTE_RETIRADO`: o participante foi retirado do estudo (a partir da retirada, T102).

        `bloqueio` é a decisão **do servidor pelo estado**; o perfil é decidido **pela tela**: o COORDENADOR vê os
        resultados sempre somente leitura, mesmo com `bloqueio: null`.

        Perfis: PESQUISADOR e COORDENADOR leem; ADMINISTRADOR e PARTICIPANTE recebem 403.
      parameters:
      - $ref: '#/components/parameters/VisitaAgendadaId'
      responses:
        '200':
          description: Atividades de avaliação da visita, com o resultado de cada uma ou nulo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadosDaVisitaResponse'
              example:
                visitaAgendadaId: d6300000-0000-4000-8000-000000001981
                situacaoVisita: REALIZADA
                bloqueio: null
                total: 1
                registrados: 1
                pendentes: 0
                atividades:
                - acaoId: d6300000-0000-4000-8000-000000001941
                  nome: Aferir pressão arterial
                  descricao: Medida simulada
                  resultado:
                    valor: 120/80
                    unidade: mmHg
                    observacao: null
                    registradoPor: Pesquisador Demo (Ficticio)
                    registradoEm: '2026-10-25T11:00:00-03:00'
                    alteradoPor: Pesquisador Demo (Ficticio)
                    alteradoEm: '2026-10-25T11:00:00-03:00'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          description: Visita agendada inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: 'Visita agendada não encontrada: d6300000-0000-4000-8000-000000009999'
                codigo: RECURSO_NAO_ENCONTRADO
        '409':
          $ref: '#/components/responses/Erro409'
  /api/visitas-agendadas/{visitaAgendadaId}/resultados/{acaoId}:
    put:
      tags:
      - Resultados das avaliações
      summary: Registrar ou editar o resultado de uma atividade
      operationId: registrarResultado
      description: |-
        Registra o resultado **fictício** de uma atividade de avaliação ou, se ela já tiver resultado, o edita (há um
        resultado por atividade e por visita agendada). Responde **201** no primeiro registro e **200** na edição,
        sempre com o resultado salvo. Quem registrou e quando não mudam na edição; quem alterou e quando passam a ser
        os da última edição.

        Regras, na ordem em que são verificadas (depois do 403 do perfil):
        1. a visita agendada existe e a atividade existe (404);
        2. o estudo não está encerrado (409 `ESTUDO_ENCERRADO`);
        3. o participante não foi retirado (409 `PARTICIPANTE_RETIRADO`, a partir da retirada, T102);
        4. a visita está REALIZADA (409 `VISITA_NAO_REALIZADA`);
        5. a atividade é da visita prevista desta visita agendada (409 `ATIVIDADE_NAO_PERTENCE_A_VISITA`) e da
           categoria `AVALIACAO_CLINICA` (409 `ATIVIDADE_FORA_DA_CATEGORIA_AVALIACAO`);
        6. o valor não está em branco (400 `VALOR_OBRIGATORIO`) e os tamanhos são respeitados (400 `VALIDACAO_CAMPOS`).

        Perfis: somente PESQUISADOR. O COORDENADOR **nunca** escreve resultados (recebe 403), assim como ADMINISTRADOR e
        PARTICIPANTE.
      parameters:
      - $ref: '#/components/parameters/VisitaAgendadaId'
      - name: acaoId
        in: path
        required: true
        description: UUID da atividade (ação) da visita prevista.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultadoRequest'
            example:
              valor: 120/80
              unidade: mmHg
              observacao: Sentado, após 5 minutos
      responses:
        '200':
          description: Resultado editado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoAtividadeResponse'
              example:
                acaoId: d6300000-0000-4000-8000-000000001941
                valor: 130/85
                unidade: mmHg
                observacao: Repetida após 10 minutos
                registradoPor: Pesquisador Demo (Ficticio)
                registradoEm: '2026-10-25T11:00:00-03:00'
                alteradoPor: Pesquisador Demo (Ficticio)
                alteradoEm: '2026-11-14T10:20:00-03:00'
        '201':
          description: Resultado registrado pela primeira vez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoAtividadeResponse'
              example:
                acaoId: d6300000-0000-4000-8000-000000001941
                valor: 120/80
                unidade: mmHg
                observacao: Sentado, após 5 minutos
                registradoPor: Pesquisador Demo (Ficticio)
                registradoEm: '2026-11-14T10:00:00-03:00'
                alteradoPor: Pesquisador Demo (Ficticio)
                alteradoEm: '2026-11-14T10:00:00-03:00'
        '400':
          description: 'Dado inválido: corpo ausente ou malformado (`CORPO_INVALIDO`), valor em branco
            (`VALOR_OBRIGATORIO`) ou tamanho acima do limite (`VALIDACAO_CAMPOS`, com `errosCampo`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                valorObrigatorio:
                  summary: Valor em branco
                  value:
                    erro: O valor do resultado é obrigatório
                    codigo: VALOR_OBRIGATORIO
                validacaoCampos:
                  summary: Unidade acima de 30 caracteres
                  value:
                    erro: 'unidade: A unidade deve ter no máximo 30 caracteres'
                    codigo: VALIDACAO_CAMPOS
                    errosCampo:
                    - campo: unidade
                      erro: A unidade deve ter no máximo 30 caracteres
                corpoInvalido:
                  summary: Corpo ausente ou JSON malformado
                  value:
                    erro: Corpo da requisição inválido ou malformado
                    codigo: CORPO_INVALIDO
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          description: Visita agendada ou atividade inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: 'Atividade não encontrada: d6300000-0000-4000-8000-000000009999'
                codigo: RECURSO_NAO_ENCONTRADO
        '409':
          description: 'Regra de negócio violada: `VISITA_NAO_REALIZADA`, `ATIVIDADE_FORA_DA_CATEGORIA_AVALIACAO`,
            `ATIVIDADE_NAO_PERTENCE_A_VISITA`, `ESTUDO_ENCERRADO` e, a partir da retirada (T102), `PARTICIPANTE_RETIRADO`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                visitaNaoRealizada:
                  summary: Visita ainda agendada, ausente ou cancelada
                  value:
                    erro: Resultados só podem ser registrados em visita realizada
                    codigo: VISITA_NAO_REALIZADA
                foraDaCategoria:
                  summary: Atividade que não é de avaliação clínica
                  value:
                    erro: Só atividades da categoria avaliação clínica recebem resultado
                    codigo: ATIVIDADE_FORA_DA_CATEGORIA_AVALIACAO
                naoPertence:
                  summary: Atividade de outra visita prevista
                  value:
                    erro: A atividade não pertence à visita prevista desta visita agendada
                    codigo: ATIVIDADE_NAO_PERTENCE_A_VISITA
                estudoEncerrado:
                  summary: Estudo encerrado
                  value:
                    erro: O estudo está encerrado e não aceita novos resultados
                    codigo: ESTUDO_ENCERRADO
                participanteRetirado:
                  summary: Participante retirado (a partir da T102)
                  value:
                    erro: O participante foi retirado do estudo
                    codigo: PARTICIPANTE_RETIRADO
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ParticipacaoId:
      name: participacaoId
      in: path
      required: true
      description: UUID da participação (o participante incluído no estudo).
      schema:
        type: string
        format: uuid
    VisitaAgendadaId:
      name: visitaAgendadaId
      in: path
      required: true
      description: UUID da visita agendada.
      schema:
        type: string
        format: uuid
  responses:
    Erro400:
      description: Validação falhou (campo obrigatório, formato de data) ou regra de formato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: 'dataHora: A data e a hora são obrigatórias'
    Erro409:
      description: Regra de negócio violada; "codigo" identifica a regra.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: 'A data deve estar entre 2026-11-14 e 2026-11-24 (janela da visita Retorno 30 dias)'
            codigo: DATA_FORA_DA_JANELA
    Erro401:
      description: Sem token ou token inválido/expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Não autenticado
    Erro403:
      description: O perfil do usuário não tem permissão.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Acesso negado para o seu perfil
    Erro404:
      description: Recurso inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: 'Participação não encontrada: d6300000-0000-4000-8000-000000001921'
            codigo: PARTICIPACAO_NAO_ENCONTRADA
  schemas:
    SituacaoVisita:
      type: string
      enum:
      - AGENDADA
      - REALIZADA
      - AUSENTE
      - CANCELADA
      description: Situação de uma visita agendada. A visita nasce AGENDADA; REALIZADA, AUSENTE e CANCELADA são finais.
    VisitaDoParticipanteResponse:
      type: object
      description: Uma visita prevista do estudo vista pelo participante, com a janela de datas e o agendamento (nulo se ainda não agendada).
      properties:
        visitaPlanejadaId:
          type: string
          format: uuid
        nome:
          type: string
          example: Retorno 30 dias
        ordem:
          type: integer
        diaPrevisto:
          type: integer
          description: Dias a partir da inclusão.
        tolerancia:
          type: integer
          description: Dias de tolerância para mais e para menos.
        dataSugerida:
          type: string
          format: date
          description: 'Data sugerida: inclusão mais dia previsto.'
          example: '2026-11-19'
        janelaInicio:
          type: string
          format: date
          description: Primeira data aceita (data sugerida menos a tolerância).
          example: '2026-11-14'
        janelaFim:
          type: string
          format: date
          description: Última data aceita (data sugerida mais a tolerância).
          example: '2026-11-24'
        agendamento:
          nullable: true
          description: A visita agendada; nulo enquanto a visita prevista não foi agendada.
          allOf:
          - $ref: '#/components/schemas/VisitaAgendadaResponse'
      required:
      - visitaPlanejadaId
      - nome
      - ordem
      - diaPrevisto
      - tolerancia
      - dataSugerida
      - janelaInicio
      - janelaFim
    VisitaAgendadaRequest:
      type: object
      description: Pedido de agendamento.
      properties:
        visitaPlanejadaId:
          type: string
          format: uuid
          description: Visita prevista do estudo da participação.
        dataHora:
          type: string
          format: date-time
          description: Data e hora **locais, sem fuso** (`yyyy-MM-ddTHH:mm` ou `yyyy-MM-ddTHH:mm:ss`).
          example: 2026-11-19T09:30
      required:
      - visitaPlanejadaId
      - dataHora
    VisitaReagendamentoRequest:
      type: object
      description: Pedido de reagendamento.
      properties:
        dataHora:
          type: string
          format: date-time
          description: Nova data e hora **locais, sem fuso**.
          example: 2026-11-20T10:00
      required:
      - dataHora
    VisitaAgendadaResponse:
      type: object
      description: Visita agendada de um participante. As datas e horas voltam com o deslocamento do fuso do centro.
      properties:
        id:
          type: string
          format: uuid
        participacaoId:
          type: string
          format: uuid
        estudoId:
          type: string
          format: uuid
        visitaPlanejadaId:
          type: string
          format: uuid
        visitaNome:
          type: string
          example: Retorno 30 dias
        participanteCodigo:
          type: string
          example: CAND-001
        participanteNome:
          type: string
          example: Pessoa Teta (Ficticia)
        dataHora:
          type: string
          format: date-time
          description: Data e hora agendadas, com deslocamento.
          example: '2026-11-19T09:30:00-03:00'
        situacao:
          $ref: '#/components/schemas/SituacaoVisita'
        dataHoraRealizada:
          type: string
          format: date-time
          nullable: true
          description: Preenchida só nas visitas REALIZADA.
        motivo:
          type: string
          nullable: true
          description: Motivo do cancelamento.
        observacao:
          type: string
          nullable: true
        janelaInicio:
          type: string
          format: date
          example: '2026-11-14'
        janelaFim:
          type: string
          format: date
          example: '2026-11-24'
        criadoPor:
          type: string
          example: Coordenador Demo (Ficticio)
        criadoEm:
          type: string
          format: date-time
          example: '2026-11-11T10:00:00-03:00'
        alteradoPor:
          type: string
          example: Coordenador Demo (Ficticio)
        alteradoEm:
          type: string
          format: date-time
          example: '2026-11-11T10:00:00-03:00'
        versao:
          type: integer
          format: int64
          description: Versão otimista; aumenta a cada alteração.
      required:
      - id
      - participacaoId
      - estudoId
      - visitaPlanejadaId
      - visitaNome
      - participanteCodigo
      - participanteNome
      - dataHora
      - situacao
      - janelaInicio
      - janelaFim
      - criadoPor
      - criadoEm
      - alteradoPor
      - alteradoEm
      - versao
    AgendaItemResponse:
      type: object
      description: Item da agenda do estudo.
      properties:
        visitaAgendadaId:
          type: string
          format: uuid
        participacaoId:
          type: string
          format: uuid
        participanteCodigo:
          type: string
          example: CAND-001
        participanteNome:
          type: string
          example: Pessoa Teta (Ficticia)
        visitaPlanejadaId:
          type: string
          format: uuid
        visitaNome:
          type: string
          example: Retorno 30 dias
        dataHora:
          type: string
          format: date-time
          example: '2026-11-19T09:30:00-03:00'
        situacao:
          $ref: '#/components/schemas/SituacaoVisita'
      required:
      - visitaAgendadaId
      - participacaoId
      - participanteCodigo
      - participanteNome
      - visitaPlanejadaId
      - visitaNome
      - dataHora
      - situacao
    PaginaAgenda:
      type: object
      description: Página da agenda do estudo.
      properties:
        conteudo:
          type: array
          items:
            $ref: '#/components/schemas/AgendaItemResponse'
        pagina:
          type: integer
          description: Base 0.
        tamanho:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
      required:
      - conteudo
      - pagina
      - tamanho
      - totalElementos
      - totalPaginas
    ParticipanteAgendaResponse:
      type: object
      description: Participante do estudo com o andamento do agendamento ("X de N visitas agendadas").
      properties:
        participacaoId:
          type: string
          format: uuid
        candidatoId:
          type: string
          format: uuid
        codigo:
          type: string
          example: CAND-001
        nomeFicticio:
          type: string
          example: Pessoa Teta (Ficticia)
        dataInclusao:
          type: string
          format: date
          example: '2026-10-20'
        visitasPrevistas:
          type: integer
          description: Visitas previstas do estudo.
        visitasAgendadas:
          type: integer
          description: Visitas previstas que já têm agendamento, em qualquer situação.
      required:
      - participacaoId
      - candidatoId
      - codigo
      - nomeFicticio
      - dataInclusao
      - visitasPrevistas
      - visitasAgendadas
    Erro:
      type: object
      description: 'Formato único de erro da API. O status HTTP identifica a classe do erro: 400 validação ou regra
        de formato, 401 sem token, 403 perfil sem permissão, 404 recurso inexistente, 409 regra de negócio violada
        (sempre com "codigo").'
      properties:
        erro:
          type: string
          description: 'Mensagem em português. Em erro de validação (400) vem no formato "campo: mensagem".'
        codigo:
          type: string
          description: Código estável da regra de negócio violada.
        status:
          type: integer
          description: Status HTTP repetido no corpo.
        codigoRegra:
          type: string
          description: Mesmo valor de `codigo` (nome do formato novo).
        mensagem:
          type: string
          description: Mesmo texto de `erro` (nome do formato novo).
        errosCampo:
          type: array
          description: Lista de erros por campo; preenchida na validação (400) e vazia nos demais erros.
          items:
            type: object
            properties:
              campo:
                type: string
              erro:
                type: string
      required:
      - erro
    SituacaoNoHistorico:
      type: string
      enum:
      - NAO_AGENDADA
      - AGENDADA
      - REALIZADA
      - AUSENTE
      - CANCELADA
      description: 'Situação de uma visita prevista no histórico: o vocabulário da visita agendada mais NAO_AGENDADA,
        para a visita prevista que ainda não tem agendamento. REALIZADA, AUSENTE e CANCELADA são finais.'
    HistoricoParticipanteResponse:
      type: object
      description: Histórico de um participante (somente leitura).
      properties:
        participante:
          $ref: '#/components/schemas/ParticipanteDoHistorico'
        resumo:
          $ref: '#/components/schemas/ResumoDoHistorico'
        visitas:
          type: array
          description: Uma linha para cada visita prevista do estudo, ordenadas por `ordem` e dia previsto, inclusive as ainda não agendadas.
          items:
            $ref: '#/components/schemas/VisitaDoHistorico'
      required:
      - participante
      - resumo
      - visitas
    ParticipanteDoHistorico:
      type: object
      description: Participante a que o histórico se refere.
      properties:
        participacaoId:
          type: string
          format: uuid
        candidatoId:
          type: string
          format: uuid
        codigo:
          type: string
          example: CAND-001
        nomeFicticio:
          type: string
          example: Pessoa Teta (Ficticia)
        dataInclusao:
          type: string
          format: date
          description: Dia 0 do cronograma do participante.
          example: '2026-10-20'
      required:
      - participacaoId
      - candidatoId
      - codigo
      - nomeFicticio
      - dataInclusao
    ResumoDoHistorico:
      type: object
      description: Contagem de visitas por situação. `pendentes = agendadas + naoAgendadas`.
      properties:
        previstas:
          type: integer
          description: Total de visitas previstas do estudo.
        realizadas:
          type: integer
        ausentes:
          type: integer
        canceladas:
          type: integer
        agendadas:
          type: integer
          description: Visitas agendadas que ainda não tiveram desfecho.
        naoAgendadas:
          type: integer
          description: Visitas previstas sem agendamento.
        pendentes:
          type: integer
          description: Visitas sem desfecho, agendadas mais não agendadas.
      required:
      - previstas
      - realizadas
      - ausentes
      - canceladas
      - agendadas
      - naoAgendadas
      - pendentes
    VisitaDoHistorico:
      type: object
      description: Uma visita prevista do estudo e o que aconteceu com ela para este participante. Sem agendamento, `situacao` é NAO_AGENDADA e os campos do agendamento vêm nulos.
      properties:
        visitaPlanejadaId:
          type: string
          format: uuid
        nome:
          type: string
          example: Triagem
        ordem:
          type: integer
        diaPrevisto:
          type: integer
          description: Dias a partir da inclusão.
        tolerancia:
          type: integer
          description: Dias de tolerância para mais e para menos.
        dataSugerida:
          type: string
          format: date
          description: 'Data prevista: inclusão mais dia previsto.'
          example: '2026-10-20'
        situacao:
          $ref: '#/components/schemas/SituacaoNoHistorico'
        visitaAgendadaId:
          type: string
          format: uuid
          nullable: true
          description: Nulo quando a visita não foi agendada.
        dataHoraAgendada:
          type: string
          format: date-time
          nullable: true
        dataHoraRealizada:
          type: string
          format: date-time
          nullable: true
          description: Preenchida só nas visitas REALIZADA.
        motivo:
          type: string
          nullable: true
          description: Motivo do cancelamento.
        observacao:
          type: string
          nullable: true
        resultados:
          type: array
          description: Resultado de cada atividade da visita; vazio se não houver.
          items:
            $ref: '#/components/schemas/ResultadoDoHistorico'
      required:
      - visitaPlanejadaId
      - nome
      - ordem
      - diaPrevisto
      - tolerancia
      - dataSugerida
      - situacao
      - resultados
    ResultadoDoHistorico:
      type: object
      description: Resultado fictício registrado para uma atividade da visita.
      properties:
        acaoId:
          type: string
          format: uuid
        nome:
          type: string
          example: Aferir pressão arterial
        valor:
          type: string
          example: 120/80
        unidade:
          type: string
          nullable: true
          example: mmHg
        observacao:
          type: string
          nullable: true
      required:
      - acaoId
      - nome
      - valor
    BloqueioResultados:
      type: string
      enum:
      - VISITA_NAO_REALIZADA
      - ESTUDO_ENCERRADO
      - PARTICIPANTE_RETIRADO
      description: 'Motivo pelo qual a visita não aceita registro nem edição de resultados; a tela mostra os resultados
        somente leitura. VISITA_NAO_REALIZADA: a visita não está REALIZADA. ESTUDO_ENCERRADO: o estudo foi encerrado.
        PARTICIPANTE_RETIRADO: o participante foi retirado (a partir da T102). Quando há mais de um motivo, vale o
        primeiro na ordem das verificações do registro: ESTUDO_ENCERRADO, PARTICIPANTE_RETIRADO, VISITA_NAO_REALIZADA.'
    ResultadosDaVisitaResponse:
      type: object
      description: Atividades de avaliação clínica de uma visita agendada, com o resultado fictício de cada uma (nulo se pendente).
      properties:
        visitaAgendadaId:
          type: string
          format: uuid
        situacaoVisita:
          $ref: '#/components/schemas/SituacaoVisita'
        bloqueio:
          allOf:
          - $ref: '#/components/schemas/BloqueioResultados'
          nullable: true
          description: Nulo quando a visita aceita registro e edição; senão, o motivo do modo somente leitura.
        total:
          type: integer
          minimum: 0
          description: Quantidade de atividades AVALIACAO_CLINICA da visita prevista.
          example: 1
        registrados:
          type: integer
          minimum: 0
          description: Quantas dessas atividades já têm resultado.
          example: 1
        pendentes:
          type: integer
          minimum: 0
          description: total - registrados.
          example: 0
        atividades:
          type: array
          items:
            $ref: '#/components/schemas/AtividadeComResultado'
      required:
      - visitaAgendadaId
      - situacaoVisita
      - bloqueio
      - total
      - registrados
      - pendentes
      - atividades
    AtividadeComResultado:
      type: object
      description: Uma atividade de avaliação clínica da visita prevista e o seu resultado (nulo = pendente).
      properties:
        acaoId:
          type: string
          format: uuid
        nome:
          type: string
          example: Aferir pressão arterial
        descricao:
          type: string
          nullable: true
          example: Medida simulada
        resultado:
          allOf:
          - $ref: '#/components/schemas/ResultadoAtividadeResponse'
          nullable: true
          description: Nulo enquanto o resultado estiver pendente.
      required:
      - acaoId
      - nome
      - resultado
    ResultadoAtividadeResponse:
      type: object
      description: Resultado fictício de uma atividade, com quem registrou e quem alterou por último (nome do usuário).
      properties:
        acaoId:
          type: string
          format: uuid
        valor:
          type: string
          example: 120/80
        unidade:
          type: string
          nullable: true
          example: mmHg
        observacao:
          type: string
          nullable: true
          example: Sentado, após 5 minutos
        registradoPor:
          type: string
          example: Pesquisador Demo (Ficticio)
        registradoEm:
          type: string
          format: date-time
          example: '2026-11-14T10:00:00-03:00'
        alteradoPor:
          type: string
          example: Pesquisador Demo (Ficticio)
        alteradoEm:
          type: string
          format: date-time
          example: '2026-11-14T10:00:00-03:00'
      required:
      - acaoId
      - valor
      - registradoPor
      - registradoEm
      - alteradoPor
      - alteradoEm
    ResultadoRequest:
      type: object
      description: Resultado fictício de uma atividade de avaliação. O valor é texto curto livre (sem faixa de referência).
      properties:
        valor:
          type: string
          minLength: 1
          maxLength: 200
          description: Obrigatório; não pode ser só espaços (VALOR_OBRIGATORIO).
          example: 120/80
        unidade:
          type: string
          nullable: true
          maxLength: 30
          example: mmHg
        observacao:
          type: string
          nullable: true
          maxLength: 500
          example: Sentado, após 5 minutos
      required:
      - valor
