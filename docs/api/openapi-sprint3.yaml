                  estudoId: d6300000-0000-4000-8000-000000001901
                  estudoTitulo: Demo - Acompanhamento de participantes
                  visitaNome: Triagem
                  dataHora: '2026-11-09T09:00:00-03:00'
                  situacao: REALIZADA
                  dataHoraRealizada: '2026-11-09T09:10:00-03:00'
                  motivo: null
                  atividades:
                  - Aferir pressão arterial
                  - Coletar sangue
                pagina: 0
                tamanho: 20
