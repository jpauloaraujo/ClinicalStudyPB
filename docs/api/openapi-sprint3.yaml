  /api/participacoes/{participacaoId}/conta:
    put:
      tags:
      - Conta do participante
      summary: Vincular uma conta de participante a um participante do estudo
      operationId: vincularContaDoParticipante
      description: |-
        Liga uma conta de perfil `PARTICIPANTE` ao participante (candidato incluído) para que ele entre no app e veja os
        estudos dele. A relação é **um para um** e **não há desvincular nem trocar a conta** nesta Sprint.

        Verificações, **nesta ordem** (a primeira que falhar responde):
        1. a participação e a conta existem: senão **404** `RECURSO_NAO_ENCONTRADO`;
        2. a participação está ativa: senão **409** `PARTICIPANTE_RETIRADO`;
        3. a conta tem perfil `PARTICIPANTE`: senão **409** `CONTA_NAO_E_PARTICIPANTE`;
        4. a conta está ativa: senão **409** `CONTA_INATIVA`;
        5. a participação ainda não tem conta: senão **409** `PARTICIPACAO_JA_TEM_CONTA` (inclusive reenviar a mesma conta);
        6. a conta não está vinculada a outro participante: senão **409** `CONTA_JA_VINCULADA`.

        Dois vínculos simultâneos da mesma conta resolvem em um sucesso e um 409 `CONTA_JA_VINCULADA`, nunca em 500.
        Enquanto a retirada de participante (T101) não existir, toda participação é ativa e o passo 2 não falha.

        Perfis: só COORDENADOR; PESQUISADOR, ADMINISTRADOR e PARTICIPANTE recebem 403.
      parameters:
      - name: participacaoId
        in: path
        required: true
        description: UUID da participação (o participante incluído no estudo).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VincularContaRequest'
            example:
              usuarioId: d6300000-0000-4000-8000-000000002401
      responses:
        '200':
          description: Conta vinculada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContaVinculadaResponse'
              example:
                participacaoId: d6300000-0000-4000-8000-000000001921
                usuarioId: d6300000-0000-4000-8000-000000002401
                nome: Participante de Demonstração
                email: participante@clinicalstudy.test
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
    get:
      tags:
      - Conta do participante
      summary: Conta vinculada a um participante
      operationId: contaDoParticipante
      description: |-
        Devolve a conta vinculada ao participante (`participacaoId`, `usuarioId`, `nome` e `email`). **404**
        (`RECURSO_NAO_ENCONTRADO`) quando a participação não existe **ou** ainda não tem conta vinculada. Nunca devolve
        senha, hash, perfil nem situação da conta.

        Perfis: PESQUISADOR e COORDENADOR leem; ADMINISTRADOR e PARTICIPANTE recebem 403.
      parameters:
      - name: participacaoId
        in: path
        required: true
        description: UUID da participação.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Conta vinculada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContaVinculadaResponse'
              example:
                participacaoId: d6300000-0000-4000-8000-000000001921
                usuarioId: d6300000-0000-4000-8000-000000002401
                nome: Participante de Demonstração
                email: participante@clinicalstudy.test
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
  /api/contas-participante/disponiveis:
    get:
      tags:
      - Conta do participante
      summary: Contas de participante disponíveis para vínculo
      operationId: contasDeParticipanteDisponiveis
      description: |-
        Lista as contas **ativas**, de perfil `PARTICIPANTE`, que **ainda não estão vinculadas** a nenhum participante,
        ordenadas por nome. Cada item traz só `usuarioId`, `nome` e `email`. Lista vazia é 200, não erro.

        Perfis: só COORDENADOR; PESQUISADOR, ADMINISTRADOR e PARTICIPANTE recebem 403.
      responses:
        '200':
          description: Contas disponíveis (pode ser vazia).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContaParticipanteResponse'
              example:
              - usuarioId: d6300000-0000-4000-8000-000000002402
                nome: Outra Participante (Ficticia)
                email: outra.participante@clinicalstudy.test
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ParticipacaoId:
      name: participacaoId
      in: path
      required: true
      description: UUID da participação (o participante incluído no estudo).
      schema:
        type: string
        format: uuid
    VisitaAgendadaId:
      name: visitaAgendadaId
      in: path
      required: true
      description: UUID da visita agendada.
      schema:
        type: string
        format: uuid
    EstudoIdOpcional:
      name: estudoId
      in: query
      required: false
      description: |-
        Restringe a consulta a um estudo do participante. Um `estudoId` que **não é do participante** devolve lista
        vazia (nunca 404 e nunca dados de outro participante). Valor que não é um UUID responde 400.
      schema:
        type: string
        format: uuid
  responses:
    ErroParametroInvalido:
      description: Parâmetro de consulta inválido (`estudoId` que não é um UUID, `pagina` negativa ou `tamanho` fora de 1 a 100).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Valor inválido para o parâmetro estudoId
            codigo: PARAMETRO_INVALIDO
    Erro400:
      description: Validação falhou (campo obrigatório, formato de data) ou regra de formato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: 'dataHora: A data e a hora são obrigatórias'
    Erro409:
      description: Regra de negócio violada; "codigo" identifica a regra.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: 'A data deve estar entre 2026-11-14 e 2026-11-24 (janela da visita Retorno 30 dias)'
            codigo: DATA_FORA_DA_JANELA
    Erro401:
      description: Sem token ou token inválido/expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Não autenticado
    Erro403:
      description: O perfil do usuário não tem permissão.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Acesso negado para o seu perfil
    Erro404:
      description: Recurso inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: 'Participação não encontrada: d6300000-0000-4000-8000-000000001921'
            codigo: PARTICIPACAO_NAO_ENCONTRADA
  schemas:
    SituacaoVisita:
      type: string
      enum:
      - AGENDADA
      - REALIZADA
      - AUSENTE
      - CANCELADA
      description: Situação de uma visita agendada. A visita nasce AGENDADA; REALIZADA, AUSENTE e CANCELADA são finais.
    TipoDesfecho:
      type: string
      enum:
      - REALIZADA
      - AUSENTE
      - CANCELADA
      description: Desfecho que o coordenador registra para uma visita agendada. Cada tipo leva a uma situação final de mesmo nome.
    DesfechoRequest:
      type: object
      description: Desfecho de uma visita agendada. Os campos que não pertencem ao `tipo` escolhido são ignorados.
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDesfecho'
        dataHoraRealizada:
          type: string
          format: date-time
          nullable: true
          description: Só para `REALIZADA`. Data e hora reais **locais, sem fuso**; não pode ser futura; omitida assume o instante atual.
          example: 2026-11-19T09:40
        motivo:
          type: string
          nullable: true
          maxLength: 500
          description: Só para `CANCELADA`, onde é **obrigatório**, com 5 ou mais caracteres depois do `trim`.
          example: Participante em viagem
        observacao:
          type: string
          nullable: true
          maxLength: 500
          description: Opcional nos três tipos.
          example: Participante chegou no horário
      required:
      - tipo
    VisitaDoParticipanteResponse:
      type: object
      description: Uma visita prevista do estudo vista pelo participante, com a janela de datas e o agendamento (nulo se ainda não agendada).
      properties:
        visitaPlanejadaId:
          type: string
          format: uuid
        nome:
          type: string
          example: Retorno 30 dias
        ordem:
          type: integer
        diaPrevisto:
          type: integer
          description: Dias a partir da inclusão.
        tolerancia:
          type: integer
          description: Dias de tolerância para mais e para menos.
        dataSugerida:
          type: string
          format: date
          description: 'Data sugerida: inclusão mais dia previsto.'
          example: '2026-11-19'
        janelaInicio:
          type: string
          format: date
          description: Primeira data aceita (data sugerida menos a tolerância).
          example: '2026-11-14'
        janelaFim:
          type: string
          format: date
          description: Última data aceita (data sugerida mais a tolerância).
          example: '2026-11-24'
        agendamento:
          nullable: true
          description: A visita agendada; nulo enquanto a visita prevista não foi agendada.
          allOf:
          - $ref: '#/components/schemas/VisitaAgendadaResponse'
      required:
      - visitaPlanejadaId
      - nome
      - ordem
      - diaPrevisto
      - tolerancia
      - dataSugerida
      - janelaInicio
      - janelaFim
    VisitaAgendadaRequest:
      type: object
      description: Pedido de agendamento.
      properties:
        visitaPlanejadaId:
          type: string
          format: uuid
          description: Visita prevista do estudo da participação.
        dataHora:
          type: string
          format: date-time
          description: Data e hora **locais, sem fuso** (`yyyy-MM-ddTHH:mm` ou `yyyy-MM-ddTHH:mm:ss`).
          example: 2026-11-19T09:30
      required:
      - visitaPlanejadaId
      - dataHora
    VisitaReagendamentoRequest:
      type: object
      description: Pedido de reagendamento.
      properties:
        dataHora:
          type: string
          format: date-time
          description: Nova data e hora **locais, sem fuso**.
          example: 2026-11-20T10:00
      required:
      - dataHora
    VisitaAgendadaResponse:
      type: object
      description: Visita agendada de um participante. As datas e horas voltam com o deslocamento do fuso do centro.
      properties:
        id:
          type: string
          format: uuid
        participacaoId:
          type: string
          format: uuid
        estudoId:
          type: string
          format: uuid
        visitaPlanejadaId:
          type: string
          format: uuid
        visitaNome:
          type: string
          example: Retorno 30 dias
        participanteCodigo:
          type: string
          example: CAND-001
        participanteNome:
          type: string
          example: Pessoa Teta (Ficticia)
        dataHora:
          type: string
          format: date-time
          description: Data e hora agendadas, com deslocamento.
          example: '2026-11-19T09:30:00-03:00'
        situacao:
          $ref: '#/components/schemas/SituacaoVisita'
        dataHoraRealizada:
          type: string
          format: date-time
          nullable: true
          description: Preenchida só nas visitas REALIZADA.
        motivo:
          type: string
          nullable: true
          description: Motivo do cancelamento.
        observacao:
          type: string
          nullable: true
        janelaInicio:
          type: string
          format: date
          example: '2026-11-14'
        janelaFim:
          type: string
          format: date
          example: '2026-11-24'
        criadoPor:
          type: string
          example: Coordenador Demo (Ficticio)
        criadoEm:
          type: string
          format: date-time
          example: '2026-11-11T10:00:00-03:00'
        alteradoPor:
          type: string
          example: Coordenador Demo (Ficticio)
        alteradoEm:
          type: string
          format: date-time
          example: '2026-11-11T10:00:00-03:00'
        versao:
          type: integer
          format: int64
          description: Versão otimista; aumenta a cada alteração.
      required:
      - id
      - participacaoId
      - estudoId
      - visitaPlanejadaId
      - visitaNome
      - participanteCodigo
      - participanteNome
      - dataHora
      - situacao
      - janelaInicio
      - janelaFim
      - criadoPor
      - criadoEm
      - alteradoPor
      - alteradoEm
      - versao
    AgendaItemResponse:
