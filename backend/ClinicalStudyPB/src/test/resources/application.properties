# =============================================================================
# ClinicalStudyPB — Configuracao de Testes Automatizados (H2 em modo PostgreSQL)
# Executa as mesmas migrations do Flyway (db/migration) e valida as entidades JPA
# =============================================================================
spring.application.name=ClinicalStudyPB-Test
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:clinicalstudypb_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**

# =============================================================================
# Seguranca e Autenticacao JWT — Chave ficticia exclusiva de testes (>= 256 bits)
# =============================================================================
jwt.secret=teste-segredo-com-pelo-menos-256-bits-ficticio-para-os-testes-123456
jwt.issuer=clinicalstudypb
jwt.expiration-minutes=30
