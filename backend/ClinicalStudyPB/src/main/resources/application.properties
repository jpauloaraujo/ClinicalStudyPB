# =============================================================================
# ClinicalStudyPB — Configuracao Principal da Aplicacao (Spring Boot)
# =============================================================================
spring.application.name=ClinicalStudyPB
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8081}

# =============================================================================
# Banco de Dados (PostgreSQL) — Sobrescrevivel por variaveis de ambiente
# ou pelo arquivo local ignorado no Git: application-dev.properties
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinicalstudypb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# JPA / Hibernate — Schema gerenciado pelo Flyway (validacao contra entidades)
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# =============================================================================
# Flyway Migrations (T09)
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# =============================================================================
# Documentacao da API — springdoc-openapi / Swagger UI (T10)
# =============================================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.paths-to-match=/api/**

# =============================================================================
# Seguranca e Autenticacao JWT (T19 / T20)
# =============================================================================
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:clinicalstudypb}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}

# =============================================================================
# CORS (T67) — origens do navegador que podem chamar a API
# =============================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8082}
